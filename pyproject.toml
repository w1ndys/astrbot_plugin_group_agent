[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# BLE001（禁止捕获宽泛异常）和 S110（try-except-pass）在本项目中有意关闭：
#
#   1. AstrBot 插件开发规范明确要求「良好的错误处理机制，不要让插件因一个错误而崩溃」；
#   2. 更关键的是，协议端（OneBot v11）的异常必须被转换成可读文本回填给模型。
#      如果直接向上抛出，Agent 的工具调用循环会被中断，模型失去自我纠正的机会。
#
# 因此这里的宽泛捕获是刻意的设计，而不是疏漏。
ignore = ["BLE001", "S110"]
